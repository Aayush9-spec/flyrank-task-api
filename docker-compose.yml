services:
  db:
    image: postgres:16-alpine
    container_name: flyrank-postgres
    environment:
      POSTGRES_USER: flyrank
      POSTGRES_PASSWORD: flyrank_dev_password
      POSTGRES_DB: flyrank_tasks
      PGDATA: /var/lib/postgresql/data
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flyrank -d flyrank_tasks"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    env_file:
      - .env
    container_name: flyrank-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://flyrank:flyrank_dev_password@db:5432/flyrank_tasks
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data: